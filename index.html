<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Medication Travel Kit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Firebase Web SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card-glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="pb-24">
  <div id="app" class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Navigation Header -->
    <div class="flex items-center justify-between card-glass p-4 rounded-2xl shadow-lg">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-brain text-teal-400"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-slate-100">AI Medication Kit</h1>
          <p class="text-xs text-slate-400" id="sync-status"><i class="fa-solid fa-cloud text-teal-400"></i> Firebase & Gemini Ready</p>
        </div>
      </div>
      <!-- Scanner Trigger Button -->
      <label class="cursor-pointer bg-teal-500 hover:bg-teal-600 text-slate-900 font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow-md">
        <i class="fa-solid fa-camera"></i> Scan Label
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageScan(event)" />
      </label>
    </div>

    <!-- AI Refill Banner Alert -->
    <div id="ai-alert-banner" class="hidden bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 text-xs text-amber-300">
      <div class="flex items-center gap-2 font-bold mb-1">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Refill Warning</span>
      </div>
      <p id="ai-alert-text">Analyzing stock levels...</p>
    </div>

    <!-- Interactive AI Assistant Accordion -->
    <div class="card-glass rounded-2xl p-4 border border-teal-500/30">
      <div class="flex items-center justify-between cursor-pointer" onclick="toggleAIChat()">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-teal-400"></i>
          <span class="font-bold text-sm text-slate-200">Ask Gemini AI Advisor</span>
        </div>
        <i id="ai-chevron" class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
      </div>
      
      <div id="ai-chat-body" class="mt-3 space-y-3 hidden">
        <div class="flex gap-2">
          <input type="text" id="ai-query-input" placeholder="Ask about interactions, trip duration..." class="flex-1 bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-teal-500" />
          <button onclick="askAI()" class="bg-teal-500 text-slate-900 font-bold px-3 py-2 rounded-xl text-xs">Ask</button>
        </div>
        <div id="ai-response" class="bg-slate-900/60 p-3 rounded-xl text-xs text-slate-300 leading-relaxed min-h-[50px] border border-slate-800">
          Tap "Ask" to get AI insights about your current 9 medications or trip safety.
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex gap-2">
      <input type="text" id="search-input" oninput="handleSearch()" placeholder="Search medications..." class="flex-1 bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-teal-500" />
      <button onclick="toggleGrouping()" id="group-toggle-btn" class="bg-slate-800 border border-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 whitespace-nowrap">
        <i class="fa-solid fa-layer-group text-teal-400"></i> Grouped
      </button>
    </div>

    <!-- Records Container -->
    <div id="records-container" class="space-y-4">
      <div class="text-center py-10 text-slate-400 text-sm">Connecting to cloud database...</div>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCH4j-w0vpPgYlfIc5pTR1ea42PGzFX2bc",
      authDomain: "med-kit-8a068.firebaseapp.com",
      projectId: "med-kit-8a068",
      storageBucket: "med-kit-8a068.firebasestorage.app",
      messagingSenderId: "938638503242",
      appId: "1:938638503242:web:dfe6730fe33e7f32d1a5b3",
      measurementId: "G-VR9Y1ERCD8"
    };

    // Gemini API Key
    const GEMINI_API_KEY = "AQ.Ab8RN6IHUtimqtlXBCrpemR2agFKh9k5NAAllfsFGPojwtWXwQ";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const SEED_RECORDS = [
      { id: "colmibe-20-10", name: "Colmibe 20/10", activeIngredient: "Atorvastatina / Ezetimiba", strength: "20 mg / 10 mg", manufacturer: "Farmacéutica Paraguaya S.A.", quantityRemaining: 126, dailyUsage: 1, purpose: "Hypercholesterolemia", expirationDate: "2027-01-19" },
      { id: "ezetimibe-simvastatina-mk", name: "Ezetimibe / Simvastatina (MK)", activeIngredient: "Ezetimibe / Simvastatina", strength: "10 mg / 20 mg", manufacturer: "Tecnoquímicas S.A.", quantityRemaining: 10, dailyUsage: 1, purpose: "Hypercholesterolemia", expirationDate: "2026-09-25" },
      { id: "tanzaar-100", name: "Tanzaar 100 mg", activeIngredient: "Losartan potassique", strength: "100 mg", manufacturer: "Afric-Phar", quantityRemaining: 30, dailyUsage: 1, purpose: "Hypertension", expirationDate: "2027-08-31" },
      { id: "pregabalina-krka-75", name: "Pregabalina Krka 75 mg", activeIngredient: "Pregabalina", strength: "75 mg", manufacturer: "KRKA", quantityRemaining: 266, dailyUsage: 1, purpose: "Neuropathic Pain", expirationDate: "2027-11-30" },
      { id: "levocetirizina-5mg", name: "Dicloridrato de levocetirizina 5 mg", activeIngredient: "Levocetirizina", strength: "5 mg", manufacturer: "Eurofarma", quantityRemaining: 9, dailyUsage: 1, purpose: "Allergies", expirationDate: "2027-11-30" },
      { id: "aero-red-forte-240", name: "Aero-Red Forte 240 mg", activeIngredient: "Simeticona", strength: "240 mg", manufacturer: "Uriach Consumer Healthcare", quantityRemaining: 12, dailyUsage: 0, purpose: "Gas Relief", expirationDate: "2027-12-31" },
      { id: "nebivolol-5mg", name: "Cloridrato de nebivolol 5 mg", activeIngredient: "Nebivolol", strength: "5 mg", manufacturer: "Torrent Pharma", quantityRemaining: 10, dailyUsage: 1, purpose: "Hypertension", expirationDate: "2028-09-30" },
      { id: "neblock-10mg", name: "NEBLOCK® 10 mg", activeIngredient: "Cloridrato de nebivolol", strength: "10 mg", manufacturer: "Torrent Pharma", quantityRemaining: 10, dailyUsage: 1, purpose: "Hypertension", expirationDate: "2026-08-31" },
      { id: "tonval-40mg", name: "Tonval 40", activeIngredient: "Pantoprazol", strength: "40 mg", manufacturer: "Laboratorios Rowe", quantityRemaining: 7, dailyUsage: 1, purpose: "Acid Reflux / GERD", expirationDate: "2028-12-31" }
    ];

    let state = { medications: [], isGrouped: true, searchTerm: "" };

    async function init() {
      db.collection("medications").onSnapshot(async (snapshot) => {
        if (snapshot.empty) {
          for (const item of SEED_RECORDS) {
            await db.collection("medications").doc(item.id).set(item);
          }
        } else {
          state.medications = snapshot.docs.map(doc => doc.data());
          render();
          checkAIBottlenecks();
        }
      });
    }

    function calculateRunOutDate(daysRemaining) {
      if (daysRemaining === Infinity || isNaN(daysRemaining)) return "As needed";
      const target = new Date();
      target.setDate(target.getDate() + daysRemaining);
      return target.toISOString().split('T')[0];
    }

    function checkAIBottlenecks() {
      const lowStock = state.medications.filter(m => m.dailyUsage > 0 && m.quantityRemaining <= 10);
      if (lowStock.length > 0) {
        const names = lowStock.map(m => `${m.name} (${m.quantityRemaining} left)`).join(", ");
        document.getElementById("ai-alert-text").innerText = `Critical low stock on: ${names}. Refill before travel.`;
        document.getElementById("ai-alert-banner").classList.remove("hidden");
      }
    }

    function render() {
      const container = document.getElementById("records-container");
      let filtered = state.medications.filter(m => 
        m.name.toLowerCase().includes(state.searchTerm.toLowerCase()) ||
        m.purpose.toLowerCase().includes(state.searchTerm.toLowerCase())
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No medications found</div>`;
        return;
      }

      if (state.isGrouped) {
        const groups = {};
        filtered.forEach(med => {
          if (!groups[med.purpose]) groups[med.purpose] = [];
          groups[med.purpose].push(med);
        });

        let html = "";
        for (const [purpose, meds] of Object.entries(groups)) {
          let totalPills = 0;
          let minDaysLeft = Infinity;
          let bottleneckMed = "";

          meds.forEach(m => {
            totalPills += m.quantityRemaining;
            if (m.dailyUsage > 0) {
              const days = Math.floor(m.quantityRemaining / m.dailyUsage);
              if (days < minDaysLeft) {
                minDaysLeft = days;
                bottleneckMed = m.name;
              }
            }
          });

          const bottleneckDate = calculateRunOutDate(minDaysLeft);

          html += `
            <div class="card-glass rounded-2xl p-4 mb-4 border border-slate-700/50">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs uppercase tracking-wider font-bold text-teal-400 bg-teal-500/10 px-2.5 py-1 rounded-lg border border-teal-500/20">${purpose}</span>
                <span class="text-xs text-slate-400">${meds.length} Item(s)</span>
              </div>
              <div class="bg-slate-800/60 rounded-xl p-3 mb-3 text-xs space-y-1">
                <div class="flex justify-between text-slate-300">
                  <span>Total Stock:</span>
                  <span class="font-bold text-slate-100">${totalPills} pills</span>
                </div>
                <div class="flex justify-between text-amber-400">
                  <span>Earliest Refill Needed:</span>
                  <span class="font-bold">${bottleneckDate} ${minDaysLeft !== Infinity ? `(${minDaysLeft} days)` : ''}</span>
                </div>
                ${bottleneckMed ? `<div class="text-[10px] text-slate-500 text-right">Bottleneck: ${bottleneckMed}</div>` : ''}
              </div>
              <div class="space-y-2">
                ${meds.map(m => renderMedCard(m)).join('')}
              </div>
            </div>
          `;
        }
        container.innerHTML = html;
      } else {
        container.innerHTML = `<div class="space-y-2">${filtered.map(m => renderMedCard(m)).join('')}</div>`;
      }
    }

    function renderMedCard(med) {
      const daysLeft = med.dailyUsage > 0 ? Math.floor(med.quantityRemaining / med.dailyUsage) : Infinity;
      const runOutDate = calculateRunOutDate(daysLeft);

      return `
        <div class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-3 flex justify-between items-center">
          <div>
            <h4 class="font-semibold text-sm text-slate-100">${med.name}</h4>
            <p class="text-xs text-slate-400">${med.activeIngredient || med.strength}</p>
            <div class="flex gap-2 mt-1">
              <span class="text-[10px] bg-slate-700/50 text-slate-300 px-1.5 py-0.5 rounded">${med.quantityRemaining} left</span>
              <span class="text-[10px] bg-slate-700/50 text-slate-300 px-1.5 py-0.5 rounded">${med.dailyUsage > 0 ? med.dailyUsage + '/day' : 'As needed'}</span>
            </div>
          </div>
          <div class="text-right space-y-1">
            <span class="text-xs font-semibold text-teal-400 block">${runOutDate}</span>
            <div class="flex items-center justify-end gap-1">
              <button onclick="updatePillCount('${med.id}', ${med.quantityRemaining - 1})" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-0.5 rounded text-xs font-bold">-1</button>
              <button onclick="updatePillCount('${med.id}', ${med.quantityRemaining + 1})" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-0.5 rounded text-xs font-bold">+1</button>
            </div>
          </div>
        </div>
      `;
    }

    async function updatePillCount(docId, newCount) {
      if (newCount < 0) return;
      await db.collection("medications").doc(docId).update({ quantityRemaining: newCount });
    }

    function toggleGrouping() {
      state.isGrouped = !state.isGrouped;
      render();
    }

    function handleSearch() {
      state.searchTerm = document.getElementById("search-input").value;
      render();
    }

    function toggleAIChat() {
      const body = document.getElementById("ai-chat-body");
      const chevron = document.getElementById("ai-chevron");
      body.classList.toggle("hidden");
      chevron.classList.toggle("rotate-180");
    }

    async function askAI() {
      const query = document.getElementById("ai-query-input").value;
      const respBox = document.getElementById("ai-response");
      if (!query) return;

      respBox.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Gemini is analyzing your inventory...";

      const prompt = `You are a clinical travel medication assistant. The user's active kit contains: ${JSON.stringify(state.medications)}. Answer this user query concisely with safety and timing guidelines: ${query}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await response.json();
        const text = data.candidates[0].content.parts[0].text;
        respBox.innerText = text;
      } catch (e) {
        respBox.innerText = "Error consulting AI assistant. Check network connection.";
      }
    }

    async function handleImageScan(event) {
      const file = event.target.files[0];
      if (!file) return;

      const respBox = document.getElementById("ai-response");
      document.getElementById("ai-chat-body").classList.remove("hidden");
      respBox.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> AI scanning label image...";

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Data = reader.result.split(',')[1];
        const prompt = "Analyze this pill box or prescription label image. Extract medication name, active ingredient, strength, purpose, and quantity remaining. Respond ONLY in valid JSON matching format: {\"name\":\"\", \"activeIngredient\":\"\", \"strength\":\"\", \"purpose\":\"\", \"quantityRemaining\":30, \"dailyUsage\":1}";

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { inline_data: { mime_type: file.type, data: base64Data } },
                  { text: prompt }
                ]
              }]
            })
          });
          const data = await response.json();
          const rawText = data.candidates[0].content.parts[0].text;
          const cleanJson = rawText.substring(rawText.indexOf('{'), rawText.lastIndexOf('}') + 1);
          const parsed = JSON.parse(cleanJson);

          const docId = parsed.name.toLowerCase().replace(/[^a-z0-9]/g, '-');
          parsed.id = docId;
          parsed.expirationDate = "2027-12-31";

          await db.collection("medications").doc(docId).set(parsed);
          respBox.innerText = `Success! Added ${parsed.name} directly to your cloud inventory.`;
        } catch (err) {
          respBox.innerText = "Failed to scan image label. Ensure image is clear.";
        }
      };
      reader.readAsDataURL(file);
    }

    init();
  </script>
</body>
</html>
