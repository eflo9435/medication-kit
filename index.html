<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Medication Travel Kit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
  <div class="max-w-xl mx-auto p-4 space-y-6">

    <!-- Header -->
    <header class="bg-slate-800 border border-slate-700 rounded-2xl p-4 flex items-center justify-between shadow-lg">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center text-xl font-bold">🧠</div>
        <div>
          <h1 class="text-lg font-bold">AI Medication Kit</h1>
          <p class="text-xs text-slate-400">☁️ Firebase & Gemini Ready</p>
        </div>
      </div>
      <label class="bg-teal-500 hover:bg-teal-600 text-slate-950 px-3 py-2 rounded-xl text-xs font-bold cursor-pointer transition flex items-center gap-1 shadow">
        📷 Scan Label
        <input type="file" id="cameraInput" accept="image/*" class="hidden">
      </label>
    </header>

    <!-- AI Advisor Collapsible Section -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-3">
      <details class="group">
        <summary class="flex justify-between items-center cursor-pointer font-semibold text-teal-400 text-sm select-none">
          <span>✨ Ask Gemini AI Advisor</span>
          <span class="text-xs transition-transform group-open:rotate-180">▼</span>
        </summary>
        <div class="mt-3 space-y-3 pt-2 border-t border-slate-700/50">
          <textarea id="aiPrompt" placeholder="Ask about interactions, dosage rules, or travel restrictions..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-teal-500 min-h-[70px]"></textarea>
          <div class="flex gap-2">
            <button id="askAiBtn" class="bg-teal-500 hover:bg-teal-600 text-slate-950 text-xs font-bold py-2 px-4 rounded-xl transition flex-1">Ask AI Advisor</button>
            <button id="checkStockBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold py-2 px-3 rounded-xl transition">Check Bottlenecks</button>
          </div>
          <div id="aiResponse" class="hidden bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-xs leading-relaxed text-slate-300"></div>
        </div>
      </details>
    </div>

    <!-- Search & Filters -->
    <div class="flex gap-2">
      <input type="text" id="searchInput" placeholder="Search medications..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-teal-500">
      <button id="toggleGroupBtn" class="bg-slate-800 border border-slate-700 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-700 flex items-center gap-1">
        🥞 Grouped
      </button>
    </div>

    <!-- Medication List -->
    <div id="medList" class="space-y-3">
      <p class="text-center text-xs text-slate-500 py-8">Connecting to cloud database...</p>
    </div>

  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSy...", 
      authDomain: "med-kit-8a068.firebaseapp.com",
      projectId: "med-kit-8a068",
      storageBucket: "med-kit-8a068.appspot.com",
      messagingSenderId: "1055740443423",
      appId: "1:1055740443423:web:f5628dd532aa87d60ffea0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const SEED_RECORDS = [
      { id: "colmibe-20-10", name: "Colmibe 20/10", activeIngredient: "Atorvastatina / Ezetimiba", strength: "20 mg / 10 mg", manufacturer: "Farmacéutica Paraguaya S.A.", quantityRemaining: 126, dailyUsage: 1, purpose: "Hypercholesterolemia", expirationDate: "2027-01-19" },
      { id: "ezetimibe-simvastatina-mk", name: "Ezetimibe / Simvastatina (MK)", activeIngredient: "Ezetimibe / Simvastatina", strength: "10 mg / 20 mg", manufacturer: "Tecnoquímicas S.A.", quantityRemaining: 10, dailyUsage: 1, purpose: "Hypercholesterolemia", expirationDate: "2026-09-25" },
      { id: "tanzaar-100", name: "Tanzaar 100 mg", activeIngredient: "Losartan potassique", strength: "100 mg", manufacturer: "Afric-Phar", quantityRemaining: 30, dailyUsage: 1, purpose: "Hypertension", expirationDate: "2027-08-31" },
      { id: "pregabalina-krka-75", name: "Pregabalina Krka 75 mg", activeIngredient: "Pregabalina", strength: "75 mg", manufacturer: "KRKA", quantityRemaining: 266, dailyUsage: 1, purpose: "Neuropathic Pain", expirationDate: "2027-11-30" },
      { id: "levocetirizina-5mg", name: "Dicloridrato de levocetirizina 5 mg", activeIngredient: "Levocetirizina", strength: "5 mg", manufacturer: "Eurofarma", quantityRemaining: 9, dailyUsage: 1, purpose: "Allergies", expirationDate: "2027-11-30" },
      { id: "aero-red-forte-240", name: "Aero-Red Forte 240 mg", activeIngredient: "Simeticona", strength: "240 mg", manufacturer: "Uriach Consumer Healthcare", quantityRemaining: 12, dailyUsage: 0, purpose: "Gas Relief", expirationDate: "2027-12-31" },
      { id: "nebivolol-5mg", name: "Cloridrato de nebivolol 5 mg", activeIngredient: "Nebivolol", strength: "5 mg", manufacturer: "Torrent Pharma", quantityRemaining: 10, dailyUsage: 1, purpose: "Hypertension", expirationDate: "2028-09-30" },
      { id: "neblock-10mg", name: "NEBLOCK® 10 mg", activeIngredient: "Cloridrato de nebivolol", strength: "10 mg", manufacturer: "Torrent Pharma", quantityRemaining: 10, dailyUsage: 1, purpose: "Hypertension", expirationDate: "2026-08-31" },
      { id: "tonval-40mg", name: "Tonval 40", activeIngredient: "Pantoprazol", strength: "40 mg", manufacturer: "Laboratorios Rowe", quantityRemaining: 100, dailyUsage: 1, purpose: "Acid Reflux / GERD", expirationDate: "2028-12-31" },
      { id: "domperidona-10mg", name: "Domperidona 10 mg", activeIngredient: "Domperidona", strength: "10 mg", manufacturer: "EMS", quantityRemaining: 27, dailyUsage: 0, purpose: "Nausea / Gastric Motility", expirationDate: "2027-07-31" }
    ];

    let currentMeds = [];
    let isGrouped = true;

    async function initApp() {
      db.collection("medications").onSnapshot(async (snapshot) => {
        if (snapshot.empty) {
          const batch = db.batch();
          SEED_RECORDS.forEach((med) => {
            const docRef = db.collection("medications").doc(med.id);
            batch.set(docRef, med);
          });
          await batch.commit();
          return;
        }

        currentMeds = [];
        snapshot.forEach((doc) => currentMeds.push({ id: doc.id, ...doc.data() }));
        renderMedications();
      });
    }

    function renderMedications() {
      const medList = document.getElementById("medList");
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      
      let filtered = currentMeds.filter(m => 
        m.name.toLowerCase().includes(searchTerm) || 
        (m.activeIngredient && m.activeIngredient.toLowerCase().includes(searchTerm)) ||
        (m.purpose && m.purpose.toLowerCase().includes(searchTerm))
      );

      if (filtered.length === 0) {
        medList.innerHTML = `<p class="text-center text-xs text-slate-500 py-8">No medications found.</p>`;
        return;
      }

      if (!isGrouped) {
        medList.innerHTML = filtered.map(m => renderMedCard(m)).join('');
        return;
      }

      const groups = {};
      filtered.forEach(m => {
        const key = m.purpose || "General";
        if (!groups[key]) groups[key] = [];
        groups[key].push(m);
      });

      let html = '';
      for (const [purpose, items] of Object.entries(groups)) {
        html += `
          <div class="space-y-2">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1 pt-2">${purpose}</h2>
            ${items.map(m => renderMedCard(m)).join('')}
          </div>
        `;
      }
      medList.innerHTML = html;
    }

    function renderMedCard(m) {
      const daysLeft = m.dailyUsage > 0 ? Math.floor(m.quantityRemaining / m.dailyUsage) : 'N/A';
      return `
        <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-sm hover:border-slate-600 transition space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-slate-100 text-sm">${m.name}</h3>
              <p class="text-xs text-slate-400">${m.activeIngredient || ''} • ${m.strength || ''}</p>
            </div>
            <span class="text-[10px] font-semibold bg-slate-700/60 text-slate-300 px-2.5 py-1 rounded-lg">${m.manufacturer || 'Generic'}</span>
          </div>

          <div class="flex items-center justify-between text-xs pt-1 border-t border-slate-700/50">
            <div>
              <span class="text-slate-400">Stock:</span> 
              <span class="font-bold text-teal-400 text-sm ml-1">${m.quantityRemaining}</span>
              <span class="text-[10px] text-slate-500 ml-1">(${daysLeft} days left)</span>
            </div>
            
            <div class="flex items-center space-x-1.5">
              <button onclick="updateQty('${m.id}', -1)" class="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold flex items-center justify-center text-xs active:scale-95 transition">-</button>
              <button onclick="updateQty('${m.id}', 1)" class="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold flex items-center justify-center text-xs active:scale-95 transition">+</button>
            </div>
          </div>
        </div>
      `;
    }

    async function updateQty(id, change) {
      const med = currentMeds.find(m => m.id === id);
      if (!med) return;
      const newQty = Math.max(0, (med.quantityRemaining || 0) + change);
      await db.collection("medications").doc(id).update({ quantityRemaining: newQty });
    }

    document.getElementById("searchInput").addEventListener("input", renderMedications);
    document.getElementById("toggleGroupBtn").addEventListener("click", () => {
      isGrouped = !isGrouped;
      document.getElementById("toggleGroupBtn").textContent = isGrouped ? "🥞 Grouped" : "📄 Flat";
      renderMedications();
    });

    initApp();
  </script>
</body>
</html>
